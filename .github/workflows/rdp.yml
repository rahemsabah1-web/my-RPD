name: RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Start Pinggy Tunnel
        shell: powershell
        run: |
          $cmd = 'ssh -T -p 443 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o PreferredAuthentications=none -o PubkeyAuthentication=no -R 0:127.0.0.1:3389 tcp@free.pinggy.io'
          cmd /c $cmd

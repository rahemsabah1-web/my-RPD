name: RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "rdpuser" -Password $Password
          } else {
              New-LocalUser -Name "rdpuser" -Password $Password -PasswordNeverExpires -UserMayNotChangePassword
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser" -ErrorAction SilentlyContinue

      - name: Set runneradmin password
        shell: powershell
        env:
          ADMIN_PASSWORD: ${{ secrets.RUNNER_ADMIN_PASSWORD }}
        run: |
          $Password = ConvertTo-SecureString $env:ADMIN_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Install Pinggy CLI
        shell: powershell
        run: |
          npm install -g pinggy

      - name: Start Pinggy TCP Tunnel
        shell: powershell
        run: |
          pinggy --token "${{ secrets.PINGGY_TOKEN }}" tcp 3389
